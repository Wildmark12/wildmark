<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wildmark | Creative Marketing Agency</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-bg: #050a1b;
        --color-accent: #00ff88;
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--color-bg);
        color: #ffffff;
        overflow-x: hidden;
      }
      
      /* Global Animated Background Blobs */
      .bg-blob {
        position: fixed;
        width: 800px;
        height: 800px;
        border-radius: 50%;
        filter: blur(150px);
        z-index: -10;
        opacity: 0.15;
        pointer-events: none;
        animation: blob-float 25s infinite alternate cubic-bezier(0.45, 0, 0.55, 1);
      }

      .bg-blob-1 {
        top: -10%;
        left: -5%;
        background: radial-gradient(circle, var(--color-accent) 0%, transparent 70%);
      }

      .bg-blob-2 {
        bottom: -10%;
        right: -5%;
        background: radial-gradient(circle, #4f46e5 0%, transparent 70%);
        animation-delay: -5s;
        opacity: 0.12;
      }

      .bg-blob-3 {
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, #ec4899 0%, transparent 70%);
        animation-delay: -12s;
        opacity: 0.05;
      }

      @keyframes blob-float {
        0% { transform: translate(0, 0) scale(1); }
        33% { transform: translate(100px, 60px) scale(1.1); }
        66% { transform: translate(-40px, 100px) scale(0.95); }
        100% { transform: translate(0, 0) scale(1); }
      }

      /* Utility to hide scrollbars but keep functionality */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .neon-glow {
        box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
      }
      
      .glass-card {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      
      .glass-card:hover {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.02) 100%);
        border-color: rgba(0, 255, 136, 0.5);
        transform: translateY(-8px) scale(1.02);
      }

      .chrome-text {
        background: linear-gradient(135deg, #ffffff 0%, #a0aec0 50%, #ffffff 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #050a1b;
      }
      ::-webkit-scrollbar-thumb {
        background: #1a202c;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #00ff88;
      }

      /* Entrance Animations */
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .reveal {
        animation: fadeInUp 0.8s ease-out forwards;
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0"
      }
    }
    </script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <!-- Background Blobs -->
    <div class="bg-blob bg-blob-1"></div>
    <div class="bg-blob bg-blob-2"></div>
    <div class="bg-blob bg-blob-3"></div>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
